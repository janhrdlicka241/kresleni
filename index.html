<body>
<title>Kreslíme zvířátka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&subset=latin-ext&display=swap">
<style>
/* Layout: one-screen tablet app — home with sections, a big paper sheet with step-by-step lines, journal comparing photos with the reference */
:root {
  --sky: #dcecf7;
  --sheet: #ffffff;
  --ink: #26323d;
  --muted: #5f7383;
  --new: #e5432f;
  --go: #ffc531;
  --go-ink: #3a2a00;
  --go-edge: #d99c00;
  --line: #b9d3e6;
  --gold: #f2a900;
  --hint: #fff3c4;
  --hint-edge: #e8cf6f;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--sky); color: var(--ink); font-family: var(--body);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  overflow: hidden;
}
.app {
  height: 100%; display: flex; flex-direction: column;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; max-width: 1200px; margin: 0 auto;
}
.screen { flex: 1; min-height: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; text-wrap: balance; }
button, .btn { font-family: var(--display); font-weight: 800; border: 0; cursor: pointer; color: inherit; font-size: inherit; }
button:focus-visible, .btn:focus-within { outline: 4px solid var(--new); outline-offset: 3px; }
.btn-soft { background: var(--sheet); border-radius: 16px; padding: 10px 16px; font-size: 1.1rem; box-shadow: 0 3px 0 var(--line); display: inline-flex; align-items: center; gap: 8px; }
.btn-go { background: var(--go); color: var(--go-ink); box-shadow: 0 5px 0 var(--go-edge); }
.star { width: 1em; height: 1em; fill: var(--gold); flex: none; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

/* Home */
.home { overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-bottom: 20px; }
.head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.head h1 { font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1; flex: 1; min-width: 0; }
.stars { font-family: var(--display); font-weight: 800; font-size: 1.5rem; display: inline-flex; align-items: center; gap: 6px; background: var(--sheet); border-radius: 16px; padding: 6px 14px; box-shadow: 0 3px 0 var(--line); font-variant-numeric: tabular-nums; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; }
.badge { background: var(--sheet); border-radius: 999px; padding: 6px 14px 6px 8px; font-weight: 800; font-size: .95rem; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.badge .medal { width: 24px; height: 24px; border-radius: 50%; background: var(--line); display: grid; place-items: center; }
.badge .medal svg { width: 15px; height: 15px; fill: #fff; }
.badge.on { color: var(--ink); box-shadow: 0 2px 0 var(--line); }
.badge.on .medal { background: var(--gold); }
.badge:not(.on) { opacity: .6; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec-h h2 { font-size: 1.7rem; }
.sec-h span { color: var(--muted); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.card {
  position: relative; background: var(--sheet); border-radius: 22px; padding: 12px 12px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  box-shadow: 0 4px 0 var(--line); transition: transform .12s;
}
.card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.card svg.pic { width: 100%; max-width: 160px; aspect-ratio: 1; }
.card .name { font-size: 1.3rem; }
.card .meta { font-family: var(--body); font-size: .9rem; color: var(--muted); font-weight: 600; }
.card .done { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; }
.card.locked svg.pic { opacity: .18; }
.card.locked .meta { color: var(--ink); }
.lock { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); width: 54px; height: 54px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
.lock svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2.4; }

/* Draw screen */
.draw { display: grid; gap: 14px; grid-template-rows: auto 1fr auto; }
.top { display: flex; align-items: center; gap: 12px; }
.top h2 { font-size: 1.8rem; flex: 1; min-width: 0; }
.count { font-size: 1.1rem; color: var(--muted); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tip { font-size: clamp(1.25rem, 2.8vw, 1.7rem); font-weight: 800; line-height: 1.25; min-height: 2.5em; display: flex; align-items: center; gap: 12px; }
.say { flex: none; width: 58px; height: 58px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; box-shadow: 0 4px 0 #0f171e; }
.say:active { transform: translateY(3px); box-shadow: none; }
.say svg { width: 30px; height: 30px; fill: #fff; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.say svg .w { fill: none; }
.say.talking { background: var(--new); box-shadow: 0 4px 0 #a92a1a; }
.voice { font-size: .95rem; padding: 8px 12px; }
.voice[aria-pressed="false"] { color: var(--muted); }
@media (max-width: 600px) { .voice { display: none; } }
.trick-row { display: flex; }
.trick { font-size: 1.05rem; }
.trick svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.trick-text { margin: 0; background: var(--hint); border: 2px solid var(--hint-edge); border-radius: 16px; padding: 12px 14px; font-weight: 700; font-size: 1.15rem; line-height: 1.35; }
.help-toggle[aria-pressed="false"] { color: var(--muted); }
.tip .swatch { flex: none; width: 34px; height: 8px; border-radius: 4px; background: var(--new); }
.stage { min-height: 0; min-width: 0; display: flex; justify-content: center; align-items: center; container-type: size; }
.sheet { background: var(--sheet); border-radius: 24px; width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); box-shadow: 0 6px 0 var(--line); display: flex; }
.sheet svg { width: 100%; height: 100%; }
.dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.dots span { width: 11px; height: 11px; border-radius: 50%; background: var(--line); }
.dots span.on { background: var(--ink); }
.dots span.cur { background: var(--new); transform: scale(1.3); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-weight: 700; font-size: .95rem; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 3px dashed #8db8de; vertical-align: middle; margin-right: 6px; }
.legend i.hatch { height: 12px; border: 0; background: repeating-linear-gradient(45deg, var(--muted) 0 1.5px, transparent 1.5px 6px); }
.nav { display: grid; grid-template-columns: 1fr 2fr; gap: 14px; }
.nav > * { border-radius: 22px; padding: 18px; font-size: clamp(1.3rem, 3.2vw, 1.9rem); text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px; }
.prev { background: var(--sheet); box-shadow: 0 5px 0 var(--line); }
.nav > *:active { transform: translateY(4px); box-shadow: none; }
.nav button:disabled { opacity: .35; transform: none; }
.foot { display: flex; flex-direction: column; gap: 12px; }
.again { align-self: center; background: none; color: var(--muted); text-decoration: underline; font-size: 1.05rem; padding: 4px 8px; }

/* Compare + journal */
.compare, .journal { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.cmp-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cmp-body.over { grid-template-columns: 1fr; justify-items: center; }
.frame { background: var(--sheet); border-radius: 22px; box-shadow: 0 5px 0 var(--line); padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.frame h3 { font-size: 1.2rem; text-align: center; }
.frame .box { position: relative; aspect-ratio: 1; width: 100%; max-width: 100%; }
.frame .box > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.cmp-body.over .frame { width: min(100%, 62vh); }
.seg { display: inline-flex; background: var(--sheet); border-radius: 16px; padding: 4px; gap: 4px; box-shadow: 0 3px 0 var(--line); }
.seg button { background: none; border-radius: 12px; padding: 8px 14px; font-size: 1.05rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row input[type=range] { flex: 1; min-width: 160px; accent-color: var(--new); height: 32px; }
.danger { color: var(--new); }
.jgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.jcard { background: var(--sheet); border-radius: 20px; padding: 10px; box-shadow: 0 4px 0 var(--line); display: flex; flex-direction: column; gap: 6px; text-align: left; }
.jcard .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.jcard .pair > * { aspect-ratio: 1; width: 100%; object-fit: cover; border-radius: 12px; background: #f1f5f8; }
.jcard b { font-family: var(--display); font-size: 1.2rem; }
.jcard span { color: var(--muted); font-weight: 600; font-size: .9rem; }
.empty { background: var(--sheet); border-radius: 22px; padding: 28px; font-size: 1.2rem; font-weight: 700; color: var(--muted); max-width: 60ch; }
.parent { margin-top: 10px; align-self: flex-start; color: var(--muted); font-size: .95rem; }
.parent.hold { background: var(--line); }
.note { color: var(--muted); font-weight: 600; }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 18px); transform: translate(-50%, -220%); visibility: hidden; background: var(--ink); color: #fff; font-family: var(--display); font-weight: 800; font-size: 1.4rem; padding: 12px 22px; border-radius: 18px; display: flex; align-items: center; gap: 10px; transition: transform .35s cubic-bezier(.3,1.4,.6,1); z-index: 20; }
.toast.show { transform: translate(-50%, 0); visibility: visible; }
.busy { position: fixed; inset: 0; background: rgba(38,50,61,.45); display: grid; place-items: center; z-index: 30; color: #fff; font-family: var(--display); font-size: 1.6rem; font-weight: 800; }

@media (orientation: landscape) and (min-width: 760px) {
  .draw { grid-template-columns: minmax(0, 1fr) minmax(260px, 350px); grid-template-rows: auto 1fr; }
  .top { grid-column: 1 / -1; }
  .stage { grid-column: 1; grid-row: 2; }
  .side { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
  .nav { grid-template-columns: 1fr; }
  .nav > :last-child { order: -1; padding: 26px; }
}
@media (max-width: 560px) { .cmp-body { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <section class="screen home" id="home">
    <div class="head">
      <h1>Kreslíme</h1>
      <span class="stars" id="stars"></span>
      <button class="btn-soft help-toggle" id="helpToggle" aria-pressed="true"></button>
      <button class="btn-soft" id="openJournal"></button>
    </div>
    <div class="badges" id="badges"></div>
    <div id="sections"></div>
  </section>

  <section class="screen draw" id="draw" hidden>
    <div class="top">
      <button class="btn-soft" id="back">◀ Zpět</button>
      <h2 id="title"></h2>
      <button class="btn-soft voice" id="voice" aria-pressed="true">Předčítání: zapnuto</button>
      <div class="count" id="count"></div>
    </div>
    <div class="stage"><div class="sheet"><svg id="canvas" viewBox="0 0 400 400"></svg></div></div>
    <div class="side foot">
      <div class="tip"><button class="say" id="say" aria-label="Přečíst nahlas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button><span class="swatch" id="swatch"></span><span id="tip"></span></div>
      <div class="trick-row"><button class="btn-soft trick" id="trick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Trik</button></div>
      <p class="trick-text" id="trickText" hidden></p>
      <div class="legend" id="legend"><span id="legGuide"><i></i>slabě, pak vygumuj</span><span><i class="hatch"></i>stínuj tužkou</span></div>
      <div class="dots" id="dots"></div>
      <div class="nav">
        <button class="prev" id="prev">◀ Zpět</button>
        <button class="btn-go" id="next">Další ▶</button>
        <label class="btn btn-go" id="snap" hidden><input class="vh" type="file" accept="image/*" capture="environment" id="photo">Vyfotit obrázek</label>
      </div>
      <button class="again" id="again" hidden>Kreslit znovu od začátku</button>
    </div>
  </section>

  <section class="screen compare" id="compare" hidden>
    <div class="top">
      <button class="btn-soft" id="cmpBack">◀ Zpět</button>
      <h2 id="cmpTitle"></h2>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Zobrazení">
        <button id="modeSide" aria-pressed="true">Vedle sebe</button>
        <button id="modeOver" aria-pressed="false">Přes sebe</button>
      </div>
      <input type="range" id="mix" min="0" max="100" value="50" aria-label="Průhlednost předlohy" hidden>
    </div>
    <div class="cmp-body" id="cmpBody">
      <div class="frame" id="frameRef"><h3>Předloha</h3><div class="box"><svg id="cmpRef" viewBox="0 0 400 400"></svg></div></div>
      <div class="frame" id="framePhoto"><h3>Můj obrázek</h3><div class="box"><img id="cmpPhoto" alt="Fotka nakresleného obrázku"></div></div>
    </div>
    <p class="note" id="cmpNote"></p>
    <div class="row">
      <label class="btn btn-soft"><input class="vh" type="file" accept="image/*" capture="environment" id="rephoto">Vyfotit znovu</label>
      <button class="btn-soft danger" id="del">Smazat z deníku</button>
    </div>
  </section>

  <section class="screen journal" id="journal" hidden>
    <div class="top">
      <button class="btn-soft" id="jBack">◀ Zpět</button>
      <h2>Můj deník</h2>
    </div>
    <div class="jgrid" id="jgrid"></div>
    <button class="btn-soft parent" id="unlock" hidden></button>
    <p class="note">Verze 1.13</p>
  </section>
</div>
<div class="toast" id="toast"></div>
<div class="busy" id="busy" hidden>Ukládám fotku…</div>

<script>
const ANIMALS = [
  { id: 'kocka', name: 'Kočička', steps: [
    ['Nakresli velký kulatý obličej.', [['c',200,140,70,'#f4a340',0]]],
    ['Přidej dvě špičatá ouška.', [['p','M150 98 L150 45 L188 74','#f4a340',-1],['p','M250 98 L250 45 L212 74','#f4a340',-1]]],
    ['Oči, malý nosík a pusinku.', [['c',175,128,9,'ink',2],['c',225,128,9,'ink',2],['p','M192 152 L208 152 L200 162 Z','#e86b7c',2],['p','M200 162 Q190 178 179 170 M200 162 Q210 178 221 170',null,2]]],
    ['Tři vousky na každou stranu.', [['p','M168 158 L118 150 M168 165 L116 168 M168 172 L120 186 M232 158 L282 150 M232 165 L284 168 M232 172 L280 186',null,3]]],
    ['Pod hlavu nakresli tělíčko.', [['p','M162 200 Q120 300 140 350 L260 350 Q280 300 238 200','#f4a340',-1]]],
    ['Dvě tlapičky dole.', [['e',176,350,24,12,'#f7c27e',1],['e',224,350,24,12,'#f7c27e',1]]],
    ['A nakonec dlouhý ocásek.', [['p','M268 330 Q340 335 328 262 Q322 232 300 244','#f4a340',-2]]],
  ]},
  { id: 'ryba', name: 'Rybička', steps: [
    ['Nakresli velké šišaté tělo.', [['e',190,200,110,70,'#ff9a3c',0]]],
    ['Vzadu přidej ocásek.', [['p','M296 184 L362 130 L348 200 L362 270 L296 216','#ffc04d',-1]]],
    ['Velké oko s puntíkem.', [['c',132,182,15,'#ffffff',2],['c',128,182,6,'ink',3]]],
    ['Malou pusinku vpředu.', [['p','M86 212 Q100 222 114 213',null,2]]],
    ['Ploutvičku nahoře a dole.', [['p','M150 138 Q190 82 240 138','#ffc04d',-1],['p','M180 266 Q200 310 230 262','#ffc04d',-1]]],
    ['Dva proužky přes tělo.', [['p','M205 132 Q225 200 205 268',null,2],['p','M250 142 Q266 200 250 258',null,2]]],
    ['Bublinky z pusinky.', [['c',62,150,10,'#bfe3ff',4],['c',48,110,7,'#bfe3ff',4],['c',62,76,5,'#bfe3ff',4]]],
  ]},
  { id: 'sova', name: 'Sovička', steps: [
    ['Nakresli velké vajíčko – tělo.', [['e',200,220,110,140,'#9b6b43',0]]],
    ['Nahoře dvě pírka jako ouška.', [['p','M118 124 L110 55 L160 90','#9b6b43',-1],['p','M282 124 L290 55 L240 90','#9b6b43',-1]]],
    ['Dvě velké kulaté oči.', [['c',160,160,38,'#ffffff',2],['c',240,160,38,'#ffffff',2],['c',160,162,15,'ink',3],['c',240,162,15,'ink',3]]],
    ['Mezi oči malý zobáček.', [['p','M188 200 L212 200 L200 226 Z','#f5a623',3]]],
    ['Na bříško ovál a pírka.', [['e',200,288,64,66,'#e8cfa6',1],['p','M172 262 Q180 274 188 262 M200 262 Q208 274 216 262 M186 288 Q194 300 202 288 M214 288 Q222 300 230 288 M172 314 Q180 326 188 314 M200 314 Q208 326 216 314',null,2]]],
    ['Křidélka po stranách.', [['p','M92 200 Q58 272 126 322','#7a4f2e',1],['p','M308 200 Q342 272 274 322','#7a4f2e',1]]],
    ['Nožičky a větev.', [['p','M60 382 L340 382','#7a4f2e',-2],['p','M168 356 L162 378 M178 359 L178 380 M188 357 L194 378 M212 357 L206 378 M222 359 L222 380 M232 356 L238 378',null,2]]],
  ]},
  { id: 'prase', name: 'Prasátko', steps: [
    ['Nakresli velký kulatý obličej.', [['c',200,200,120,'#f7b2c4',0]]],
    ['Dvě trojúhelníková ouška.', [['p','M110 120 L95 50 L165 88','#f08fab',-1],['p','M290 120 L305 50 L235 88','#f08fab',-1]]],
    ['Doprostřed velký čumáček.', [['e',200,232,56,38,'#f08fab',1]]],
    ['Do čumáčku dvě dírky.', [['e',182,232,8,13,'ink',2],['e',218,232,8,13,'ink',2]]],
    ['Dvě očička.', [['c',152,162,11,'ink',2],['c',248,162,11,'ink',2]]],
    ['Usměvavou pusinku a tvářičky.', [['p','M168 288 Q200 308 232 288',null,2],['c',118,236,16,'#ff8fa8',1],['c',282,236,16,'#ff8fa8',1]]],
  ]},
  { id: 'pes', name: 'Pejsek', steps: [
    ['Nakresli šišatou hlavu.', [['e',200,190,105,115,'#e0b07a',0]]],
    ['Dvě dlouhá plandavá ouška.', [['p','M112 128 Q48 150 70 262 Q102 272 116 220','#8a5a32',1],['p','M288 128 Q352 150 330 262 Q298 272 284 220','#8a5a32',1]]],
    ['Flíček kolem jednoho oka.', [['e',240,166,32,26,'#8a5a32',1]]],
    ['Dvě očička.', [['c',164,168,12,'ink',3],['c',238,168,12,'ink',3]]],
    ['Dole velký čumák.', [['e',200,246,60,45,'#f6dcb8',2]]],
    ['Čumáček a pusinku.', [['e',200,222,20,13,'ink',3],['p','M200 235 L200 255 M200 255 Q186 270 172 258 M200 255 Q214 270 228 258',null,3]]],
    ['Vyplazený jazýček.', [['p','M190 266 Q200 296 210 266','#ff7a8a',2]]],
  ]},
];
ANIMALS.forEach(a => a.level = 'lehke');

// ---- helpers for the harder pictures ----
// ['h', d, z] = shaded area: hatched in the step view, soft shadow in the coloured picture; 'white' = always left white
const P = (cx, cy, r, a) => (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1);

const L = (d, o = {}) => ({ d, ...o });
const C = (cx, cy, r, o = {}) => ({ d: E(cx, cy, r, r), ell: [cx, cy, r, r], ...o });
const El = (cx, cy, rx, ry, o = {}) => ({ d: E(cx, cy, rx, ry), ell: [cx, cy, rx, ry], ...o });
const G = sh => ({ ...sh, guide: true });
const S = (d, tone = 1, o = {}) => ({ d, shade: tone, ...o });
const R = (x, y, w, h) => `M${x} ${y} h${w} v${h} h${-w} Z`;
const f1 = n => n.toFixed(1);
function rng(seed) { let a = seed * 9301 + 49297; return () => { a = (a * 1103515245 + 12345) % 2147483648; return a / 2147483648; }; }
function ER(cx, cy, rx, ry, deg) {
  const a = deg * Math.PI / 180, x0 = cx - rx * Math.cos(a), y0 = cy - rx * Math.sin(a), x1 = cx + rx * Math.cos(a), y1 = cy + rx * Math.sin(a);
  return `M${f1(x0)} ${f1(y0)} A${rx} ${ry} ${deg} 1 0 ${f1(x1)} ${f1(y1)} A${rx} ${ry} ${deg} 1 0 ${f1(x0)} ${f1(y0)} Z`;
}
// dark crescent on the side the angle points to (shadow side of a round form)
function crescent(cx, cy, r, ang, th) {
  const a0 = ang - 1.75, a1 = ang + 1.75;
  const p0 = [cx + r * Math.cos(a0), cy + r * Math.sin(a0)], p1 = [cx + r * Math.cos(a1), cy + r * Math.sin(a1)];
  const mid = [cx + (r - th) * Math.cos(ang), cy + (r - th) * Math.sin(ang)];
  const c = [2 * mid[0] - (p0[0] + p1[0]) / 2, 2 * mid[1] - (p0[1] + p1[1]) / 2];
  return `M${f1(p0[0])} ${f1(p0[1])} A${r} ${r} 0 1 1 ${f1(p1[0])} ${f1(p1[1])} Q${f1(c[0])} ${f1(c[1])} ${f1(p0[0])} ${f1(p0[1])} Z`;
}
// bumpy outline (foliage, fluff)
function bumpy(cx, cy, rx, ry, n, amp, seed, a0 = 0, a1 = 2 * Math.PI, closed = true) {
  const r = rng(seed); let d = '';
  for (let k = 0; k <= n; k++) {
    const a = a0 + (a1 - a0) * k / n, x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
    if (!k) { d = `M${f1(x)} ${f1(y)}`; continue; }
    const am = a - (a1 - a0) / n / 2, s = 1 + amp * (0.6 + 0.8 * r());
    d += ` Q${f1(cx + rx * s * Math.cos(am))} ${f1(cy + ry * s * Math.sin(am))} ${f1(x)} ${f1(y)}`;
  }
  return d + (closed ? ' Z' : '');
}
// short hair strokes inside an ellipse
function fur(seed, n, cx, cy, rx, ry, fmin, fmax, amin, amax, lmin, lmax, dirFn) {
  const r = rng(seed); let d = '';
  for (let i = 0; i < n; i++) {
    const a = amin + (amax - amin) * r(), f = fmin + (fmax - fmin) * Math.sqrt(r());
    const x = cx + rx * f * Math.cos(a), y = cy + ry * f * Math.sin(a);
    const da = (dirFn ? dirFn(x, y, a) : a) + (r() - 0.5) * 0.5, len = lmin + (lmax - lmin) * r();
    const x2 = x + len * Math.cos(da), y2 = y + len * Math.sin(da);
    d += `M${f1(x)} ${f1(y)} Q${f1((x + x2) / 2 + (r() - 0.5) * 6)} ${f1((y + y2) / 2 + (r() - 0.5) * 6)} ${f1(x2)} ${f1(y2)} `;
  }
  return d;
}
function qpt(p0, p1, p2, t) { const u = 1 - t; return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]; }
function pine(x, y, h) {
  return `M${x - 20} ${y} L${x} ${y - h * 0.45} L${x + 20} ${y} Z M${x - 16} ${y - h * 0.3} L${x} ${y - h * 0.75} L${x + 16} ${y - h * 0.3} Z M${x - 11} ${y - h * 0.6} L${x} ${y - h} L${x + 11} ${y - h * 0.6} Z M${x} ${y} L${x} ${y + 10}`;
}

// ---- more lessons and pictures (1.10) ----
const mirror = d => d.replace(/(-?\d+\.?\d*) (-?\d+\.?\d*)/g, (m, x, y) => `${f1(400 - +x)} ${y}`);
function scales(x0, x1, y0, y1, w, h) {
  let d = '', row = 0;
  for (let y = y0; y <= y1; y += h, row++) for (let x = x0 + (row % 2 ? w / 2 : 0); x < x1; x += w) d += `M${f1(x)} ${f1(y)} Q${f1(x + w / 2)} ${f1(y + h * 1.3)} ${f1(x + w)} ${f1(y)} `;
  return d;
}
function stipple(seed, n, cx, cy, rx, ry, dx, dy, pw) {
  const r = rng(seed); let d = '', c = 0, guard = 0;
  while (c < n && guard++ < n * 60) {
    const a = r() * 6.283, f = Math.sqrt(r()), x = cx + rx * f * Math.cos(a), y = cy + ry * f * Math.sin(a);
    const t = ((x - cx) / rx * dx + (y - cy) / ry * dy + 1) / 2;
    if (r() < Math.pow(Math.max(0, t), pw)) { d += E(f1(x), f1(y), 1.5, 1.5) + ' '; c++; }
  }
  return d;
}
function petal(cx, cy, r0, r1, a, w) {
  return `M${P(cx, cy, r0, a - w)} Q${P(cx, cy, (r0 + r1) / 2 + 6, a - w * 1.6)} ${P(cx, cy, r1, a)} Q${P(cx, cy, (r0 + r1) / 2 + 6, a + w * 1.6)} ${P(cx, cy, r0, a + w)}`;
}

// ---- "Čárky a linky": pictures without circles, built from straight lines and short strokes (1.11) ----
const U2 = (x, y) => { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; };
const tanQ = (p0, p1, p2, t) => U2(2 * (1 - t) * (p1[0] - p0[0]) + 2 * t * (p2[0] - p1[0]), 2 * (1 - t) * (p1[1] - p0[1]) + 2 * t * (p2[1] - p1[1]));
function barbs(p0, p1, p2, n, t0, t1, side, len, lean) {
  let d = '';
  for (let k = 0; k < n; k++) {
    const t = t0 + (t1 - t0) * k / (n - 1), p = qpt(p0, p1, p2, t), [tx, ty] = tanQ(p0, p1, p2, t);
    const [dx, dy] = U2((side > 0 ? ty : -ty) + tx * lean, (side > 0 ? -tx : tx) + ty * lean);
    const L = typeof len === 'function' ? len(t) : len;
    d += `M${f1(p[0])} ${f1(p[1])} L${f1(p[0] + dx * L)} ${f1(p[1] + dy * L)} `;
  }
  return d;
}
const rot = ([x, y], a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
const pt = (p, v, s) => `${f1(p[0] + v[0] * s)} ${f1(p[1] + v[1] * s)}`;

const TIERS = [[40, 112, 42], [88, 170, 66], [136, 232, 90], [188, 296, 114], [244, 350, 138]];
function tierPath(yt, yb, w) {
  let d = `M200 ${yt} Q${f1(200 - w * 0.35)} ${f1(yt + (yb - yt) * 0.55)} ${200 - w} ${yb}`;
  const n = Math.max(6, Math.round(w / 12));
  for (let i = 1; i <= n; i++) { const x = 200 - w + 2 * w * i / n; d += ` L${f1(x - w / n)} ${yb - 12} L${f1(x)} ${yb}`; }
  return d + ` Q${f1(200 + w * 0.35)} ${f1(yt + (yb - yt) * 0.55)} 200 ${yt} Z`;
}
function needles(seed, yt, yb, w, n) {
  const r = rng(seed); let d = '';
  for (let i = 0; i < n; i++) {
    const y = yt + 12 + (yb - yt - 18) * r(), half = w * (y - yt) / (yb - yt) * 0.92, x = 200 + (r() * 2 - 1) * half, s = x < 200 ? -1 : 1, L = 8 + 5 * r();
    d += `M${f1(x)} ${f1(y)} l${f1(s * L * 0.8)} ${f1(L * 0.6)} `;
  }
  return d;
}

const K0 = [110, 385], K1 = [150, 230], K2 = [285, 60];
function pinnae(side) {
  let d = '', veins = '';
  for (let k = 0; k < 13; k++) {
    const t = 0.1 + 0.82 * k / 12 + (side > 0 ? 0 : 0.03), p = qpt(K0, K1, K2, t), [tx, ty] = tanQ(K0, K1, K2, t);
    const dir = U2((side > 0 ? ty : -ty) + tx * 0.5, (side > 0 ? -tx : tx) + ty * 0.5), perp = [-dir[1], dir[0]];
    const Lp = 80 * Math.pow(1 - t, 0.8) + 12, w = Lp * 0.2;
    const q = [p[0] + dir[0] * Lp, p[1] + dir[1] * Lp], m = [p[0] + dir[0] * Lp * 0.45, p[1] + dir[1] * Lp * 0.45];
    d += `M${f1(p[0])} ${f1(p[1])} Q${pt(m, perp, w)} ${f1(q[0])} ${f1(q[1])} Q${pt(m, perp, -w)} ${f1(p[0])} ${f1(p[1])} Z `;
    veins += `M${f1(p[0])} ${f1(p[1])} L${pt(p, dir, Lp * 0.85)} `;
  }
  return [d, veins];
}

// ---- drawing engine ----
const NS = 'http://www.w3.org/2000/svg';
let uid = 0;
function norm(s) {
  if (!Array.isArray(s)) return s;
  if (s[0] === 'c') return { d: E(s[1], s[2], s[3], s[3]), ell: [s[1], s[2], s[3], s[3]], fill: s[4], z: s[5] || 0 };
  if (s[0] === 'e') return { d: E(s[1], s[2], s[3], s[4]), ell: [s[1], s[2], s[3], s[4]], fill: s[5], z: s[6] || 0 };
  if (s[0] === 'h') return { d: s[1], shade: 1, z: s[2] || 0 };
  return { d: s[1], fill: s[2], z: s[3] || 0 };
}
const ALL = [];
SECTIONS.forEach(sec => sec.items.forEach((dr, idx) => {
  dr.section = sec.id; dr.idx = idx;
  dr.steps = dr.steps.map(st => Array.isArray(st) ? { t: st[0], s: st[1].map(norm) } : { ...st, s: st.s.map(norm) });
  // helper for big circles and ovals: first 8 dots around, then join them with arcs
  dr.steps = dr.steps.flatMap(st => {
    const big = st.s.filter(sh => sh.ell && !sh.shade && !sh.clip && Math.max(sh.ell[2], sh.ell[3]) >= 40);
    if (!big.length) return [st];
    const dots = big.flatMap(sh => {
      const [cx, cy, rx, ry] = sh.ell;
      return Array.from({ length: 8 }, (_, k) => { const a = k * Math.PI / 4 - Math.PI / 2; return { d: E(cx + rx * Math.cos(a), cy + ry * Math.sin(a), 4.5, 4.5), guide: true, dot: true }; });
    });
    const shape = big.every(sh => Math.abs(sh.ell[2] - sh.ell[3]) < 4) ? 'kruh' : 'ovál';
    return [
      { t: `Nejdřív si slabě udělej 8 teček dokola, kudy půjde ${shape}: nahoře, dole, po stranách a šikmo mezi nimi.`, s: dots, help: true, tip: 'Tečky dělej malé a slabé. Naproti sobě mají být stejně daleko od středu.' },
      { ...st, tNo: st.tNo || st.t, t: 'Teď tečky spoj oblými obloučky. ' + st.t, tip: st.tip || 'Spojuj vždy jen dvě sousední tečky malým obloučkem. Papír si klidně pootoč.' },
    ];
  });
  dr.steps.forEach(st => { if ((st.s.length && st.s.every(sh => sh.guide)) || (st.erase && !st.s.length)) st.help = true; });
  ALL.push(dr);
}));
const byId = Object.fromEntries(ALL.map(d => [d.id, d]));
// the same drawing without help steps and guide lines ("Bez pomoci")
function viewOf(dr, help) {
  if (help) return dr;
  return { ...dr, steps: dr.steps.filter(st => !st.help).map(st => ({ ...st, t: st.tNo || st.t, erase: false, s: st.s.filter(sh => !sh.guide) })) };
}
function trickFor(st) {
  if (st.tip) return st.tip;
  const s = st.s;
  if (s.some(sh => sh.dot)) return 'Tečky dělej malé a slabé, ať je pak můžeš vygumovat.';
  if (s.length && s.every(sh => sh.guide)) return 'Pomocné čáry kresli úplně slabounce, skoro nepřitlačuj. Na konci je vygumuješ.';
  if (st.erase) return 'Gumuj jemně a jedním směrem, ať se papír nezmačká.';
  if (s.some(sh => sh.shade)) return 'Stínuj lehce a postupně přidávej. Čárky dělej všechny stejným směrem.';
  if (s.some(sh => sh.thin)) return 'Krátké čárky dělej rychlým švihem z ruky, ne pomalu.';
  if (s.some(sh => /Q/.test(sh.d))) return 'Na oblouk si otoč papír tak, aby se ti čára kreslila z ruky ven.';
  return 'Dívej se, kam má čára dojít, ne na špičku tužky.';
}

const RED = '#e5432f', OLD = '#3d4a56', GUIDE = '#8db8de', GRAPH = '#2b2b2b', HATCH = '#4a4a4a', INK = '#26323d';
const TONES = { 1: [9, false], 2: [5.5, false], 3: [5.5, true], 4: [3.4, true] };

function render(svg, dr, step) {
  svg.textContent = '';
  const N = dr.steps.length, fin = step >= N, pencil = dr.style === 'pencil';
  const upto = fin ? N - 1 : step;
  let eraseAt = -1;
  for (let i = 0; i <= upto; i++) if (dr.steps[i].erase) eraseAt = i;
  let items = [];
  for (let i = 0; i <= upto; i++) for (const sh of dr.steps[i].s) {
    if (sh.guide && (fin || i < eraseAt)) continue;
    items.push({ sh, i, k: items.length });
  }
  if (fin && !pencil) items.sort((a, b) => (a.sh.z || 0) - (b.sh.z || 0) || a.k - b.k);
  else items.sort((a, b) => (b.sh.shade ? 1 : 0) - (a.sh.shade ? 1 : 0) || (a.sh.z || 0) - (b.sh.z || 0) || a.k - b.k);

  const id = 'g' + (++uid);
  const defs = document.createElementNS(NS, 'defs');
  svg.appendChild(defs);
  const pats = {};
  const pat = (color, tone) => {

// --- photos ---
async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const max = 1400, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
  } finally { URL.revokeObjectURL(url); }
}
async function storePhoto(blob) {
  if (cloud.assets && cloud.db) {
    try { const r = await cloud.assets.upload(blob, { type: 'image/jpeg' }); return { photo: r.id }; }
    catch (e) { /* fall back to this device */ }
  }
  const key = 'p' + Date.now();
  await idbDo('readwrite', st => st.put(blob, key));
  return { local: key };
}
const urlCache = {};
async function photoUrl(e) {
  if (e.photo) return '/_blob/' + e.photo;
  if (!e.local) return '';
  if (urlCache[e.local]) return urlCache[e.local];
  try { const b = await idbDo('readonly', st => st.get(e.local)); return b ? (urlCache[e.local] = URL.createObjectURL(b)) : ''; } catch (err) { return ''; }
}
async function addEntry(drawingId, file) {
  $('busy').hidden = false;
  try {
    const blob = await shrink(file);
    const where = await storePhoto(blob);
    const entry = { drawingId, at: Date.now(), ...where };
    if (where.photo) {
      const ref = await cloud.db.collection('denik').add(entry);
      entry._id = ref.id; entry.src = 'cloud';
      if (!cloudJournal.some(x => x._id === ref.id)) cloudJournal.push(entry);
    } else {
      entry._id = where.local; entry.src = 'local';
      localJournal.push(entry); ls.set('denik', localJournal.map(({ src, ...x }) => x));
    }
    return entry;
  } finally { $('busy').hidden = true; }
}
async function replacePhoto(entry, file) {
  $('busy').hidden = false;
  try {
    const blob = await shrink(file);
    const where = await storePhoto(blob);
    await removeEntry(entry);
    const fresh = { drawingId: entry.drawingId, at: Date.now(), ...where };
    if (where.photo) { const ref = await cloud.db.collection('denik').add(fresh); fresh._id = ref.id; fresh.src = 'cloud'; if (!cloudJournal.some(x => x._id === ref.id)) cloudJournal.push(fresh); }
    else { fresh._id = where.local; fresh.src = 'local'; localJournal.push(fresh); ls.set('denik', localJournal.map(({ src, ...x }) => x)); }
    return fresh;
  } finally { $('busy').hidden = true; }
}

  if (e.src === 'cloud') {
    cloudJournal = cloudJournal.filter(x => x._id !== e._id);
    try { await cloud.db.doc('denik/' + e._id).delete(); } catch (err) {}
    if (e.photo && cloud.assets) { try { await cloud.assets.delete(e.photo); } catch (err) {} }
  } else {
    localJournal = localJournal.filter(x => x._id !== e._id);
    ls.set('denik', localJournal.map(({ src, ...x }) => x));
    try { await idbDo('readwrite', st => st.delete(e.local)); } catch (err) {}
  }
}

function resetDel() { delArmed = 0; $('del').textContent = 'Smazat z deníku'; }
$('del').addEventListener('click', async () => {
  if (!delArmed) { delArmed = setTimeout(resetDel, 3000); $('del').textContent = 'Opravdu smazat? Klepni znovu'; return; }
  clearTimeout(delArmed); resetDel();
  await removeEntry(cmpEntry);
  toast('Smazáno');
  go('journal');
});
$('rephoto').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f || !cmpEntry) return;
  try { const e = await replacePhoto(cmpEntry, f); openCompare(e, false); }
  catch (err) { toast('Fotku se nepodařilo uložit. Zkus to znovu.'); }
});

// --- journal ---
async function renderJournal() {
  const g = $('jgrid'); g.textContent = '';
  const list = journal();
  if (!list.length) {
    g.innerHTML = '<div class="empty">Zatím tu nic není. Dokresli obrázek, vyfoť ho a objeví se tady vedle předlohy.</div>';
  }
  for (const e of list) {
    const dr = byId[e.drawingId];
    const b = document.createElement('button'); b.className = 'jcard';
    const pair = document.createElement('div'); pair.className = 'pair';
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 400 400');
    if (dr) render(svg, dr, dr.steps.length);
    const img = document.createElement('img'); img.alt = 'Fotka';
    pair.append(svg, img);
    b.appendChild(pair);
    b.insertAdjacentHTML('beforeend', `<b></b><span>${new Date(e.at).toLocaleDateString('cs-CZ')}</span>`);
    b.querySelector('b').textContent = dr ? dr.name : 'Obrázek';
    b.addEventListener('click', () => openCompare(e, false));
    g.appendChild(b);
    photoUrl(e).then(u => { img.src = u; });
  }
  $('unlock').textContent = progress.unlockAll ? 'Pro rodiče: podrž pro zamčení podle postupu' : 'Pro rodiče: podrž 2 s pro odemčení všech obrázků';
}
$('openJournal').addEventListener('click', () => go('journal'));
$('jBack').addEventListener('click', () => go('home'));
let holdT = 0;
const holdEnd = () => { clearTimeout(holdT); $('unlock').classList.remove('hold'); };
$('unlock').addEventListener('pointerdown', () => {
  $('unlock').classList.add('hold');
  holdT = setTimeout(() => { holdEnd(); progress.unlockAll = !progress.unlockAll; saveProgress(); renderJournal(); toast(progress.unlockAll ? 'Všechny obrázky odemčené' : 'Obrázky se odemykají postupně'); }, 2000);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => $('unlock').addEventListener(ev, holdEnd));
$('unlock').addEventListener('contextmenu', e => e.preventDefault());

let toastT = 0;
function toast(msg, html) {
  const t = $('toast'); if (html) t.innerHTML = msg; else t.textContent = msg;
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

// --- cloud store (progress + journal shared across devices) ---
function refresh() { if (!$('home').hidden) renderHome(); if (!$('journal').hidden) renderJournal(); }
(async () => {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, assets] = await Promise.all([claude.use('db'), claude.use('assets')]);
    if (!db) return;
    cloud = { db, assets };
    let first = true;
    db.doc('stav/postup').onSnapshot(snap => {
      const remote = snap.exists ? snap.data() : { done: {}, unlockAll: false };
      const merged = { done: { ...(remote.done || {}) }, unlockAll: !!remote.unlockAll };
      let extra = false;
      if (first) { for (const [k, v] of Object.entries(progress.done)) if (!merged.done[k]) { merged.done[k] = v; extra = true; } if (progress.unlockAll && !merged.unlockAll) { merged.unlockAll = true; extra = true; } first = false; }
      progress = merged; ls.set('postup', progress);
      if (extra) saveProgress();
      refresh();
    }, () => {});
    db.collection('denik').onSnapshot(qs => {
      cloudJournal = qs.docs.map(d => ({ ...d.data(), _id: d.id, src: 'cloud' }));
      refresh();
    }, () => {});
  } catch (e) { /* stays on this device */ }
})();

renderHome();

</script>
